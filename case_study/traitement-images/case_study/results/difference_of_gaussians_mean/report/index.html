<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Parking -- Démonstrateur / Demonstrator</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f4f4f2;
            color: #171717;
            font: 16px system-ui, sans-serif
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 28px
        }

        header {
            border-bottom: 2px solid #222;
            margin-bottom: 24px
        }

        h1 {
            font-size: 30px;
            margin: 0 0 10px
        }

        p {
            line-height: 1.6
        }

        label {
            font-weight: 650
        }

        select,
        button {
            font: inherit;
            padding: 9px;
            background: white;
            border: 1px solid #777;
            border-radius: 4px
        }

        nav {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 22px 0
        }

        .card {
            background: white;
            border: 1px solid #ccc;
            padding: 18px
        }

        .card strong {
            display: block;
            font-size: 38px;
            margin-bottom: 5px
        }

        .meta {
            color: #444
        }

        .scene {
            background: white;
            border: 1px solid #bbb
        }

        svg {
            display: block;
            width: 100%;
            height: auto
        }

        .legend {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin: 12px 0
        }

        .key {
            display: inline-block;
            width: 30px;
            height: 18px;
            border: 3px solid #222;
            vertical-align: middle;
            margin-right: 6px
        }

        .key.free {
            border-style: dashed
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin: 20px 0
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd
        }

        a {
            color: #222
        }

        footer {
            font-size: 14px;
            color: #555;
            border-top: 1px solid #bbb;
            margin-top: 24px;
            padding-top: 12px
        }

        @media(max-width:550px) {
            main {
                padding: 16px
            }

            .cards {
                gap: 6px
            }

            .card {
                padding: 10px
            }

            .card strong {
                font-size: 28px
            }

            h1 {
                font-size: 25px
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1 id="title"></h1>
            <p id="intro"></p>
        </header>
        <nav><label for="language">Langue / Language</label><select id="language">
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select></nav>
        <nav><label for="frame" id="choose"></label><button id="prev" type="button"
                aria-label="Previous">&#8249;</button><select id="frame"></select><button id="next" type="button"
                aria-label="Next">&#8250;</button></nav>
        <p class="meta" id="meta"></p>
        <div class="cards" aria-live="polite">
            <div class="card"><strong id="free"></strong><span id="freeLabel"></span></div>
            <div class="card"><strong id="busy"></strong><span id="busyLabel"></span></div>
            <div class="card"><strong id="rate"></strong><span id="rateLabel"></span></div>
        </div>
        <div class="legend"><span><i class="key free"></i><span id="freeLegend"></span></span><span><i
                    class="key"></i><span id="busyLegend"></span></span></div>
        <div class="scene"><svg id="scene" role="img" aria-labelledby="sceneTitle">
                <title id="sceneTitle"></title>
            </svg></div>
        <table>
            <thead>
                <tr>
                    <th id="slotLabel"></th>
                    <th id="stateLabel"></th>
                </tr>
            </thead>
            <tbody id="slots"></tbody>
        </table>
        <p><a href="occupancy.csv" download id="countsLink"></a> &#183; <a href="predictions.csv" download
                id="decisionsLink"></a></p>
        <footer>
            <p id="notice"></p>
            <p id="credit"></p>
        </footer>
    </main>

        function setLanguage() {

            for (const [id, value] of Object.entries(words)) { const e = document.getElementById(id); if (e) e.textContent = value; }
            document.title = data.trial ? data.trial + ' \u00b7 ' + words.title : words.title;

        function element(tag, attrs) { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; }
        function show() {
            const row = data.frames[Number(choose.value)];
            document.getElementById('free').textContent = row.libres; document.getElementById('busy').textContent = row.occupees;
            document.getElementById('freeLabel').textContent = en ? (row.libres === 1 ? 'estimated free space' : words.freeLabel) : (row.libres === 1 ? 'place libre estimée' : words.freeLabel); document.getElementById('busyLabel').textContent = en ? (row.occupees === 1 ? 'estimated occupied space' : words.busyLabel) : (row.occupees === 1 ? 'place occupée estimée' : words.busyLabel);

            document.getElementById('meta').textContent = `${row.image_id} \u00b7 ${row.jour} ${row.heure} \u00b7 ${row.meteo} \u00b7 ${data.regions.length} ${en ? 'monitored spaces' : 'places suivies'}`;
            svg.replaceChildren(); const title = element('title', { id: 'sceneTitle' }); title.textContent = `${row.image_id} : ${row.libres} ${words.freeLabel}`; svg.append(title);
            const im = element('image', { href: row.preview_file }); svg.append(im);
